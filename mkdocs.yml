site_name: qim3d documentation
site_url: https://platform.qim.dk/qim3d/
site_author: qim3d contributors
site_description: Documentation for the qim3d python library
repo_url: https://github.com/qim-center/qim3d
repo_name: qim-center/qim3d

watch:
  - qim3d
  - docs
  - mkdocs.yml

nav:
  - User Guide:
    - Overview: index.md
    - 1. Installation: user_guide/installation.md
    - 2. Graphical User Interface: user_guide/gui.md
    - 3. Command Line Interface: user_guide/cli.md
    - 4. Collaboration: user_guide/collaboration.md
    - 5. Support: user_guide/support.md
  - Examples:
    - 1. Data handling: examples/data_handling.md
    - 2. Visualization: examples/visualization.md
    - 3. Image analysis: examples/image_analysis.md
    - 4. Synthetic data: examples/synthetic_data.md

  - API Reference:
    - qim3d: api_reference/qim3d.md
    - qim3d.detection: api_reference/detection.md
    - qim3d.features: api_reference/features.md
    - qim3d.filters: api_reference/filters.md
    - qim3d.generate: api_reference/generate.md
    - qim3d.io: api_reference/io.md
    - qim3d.mesh: api_reference/mesh.md
    - qim3d.ml: api_reference/ml.md
    - qim3d.morphology: api_reference/morphology.md
    - qim3d.operations: api_reference/operations.md
    - qim3d.processing: api_reference/processing.md
    - qim3d.segmentation: api_reference/segmentation.md
    - qim3d.viz: api_reference/viz.md
  - Release Notes: https://github.com/qim-center/qim3d/releases

theme:
  language: en
  name: material
  nav_position: top
  logo: assets/qim3d-icon.svg
  favicon: assets/qim3d-icon.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - toc.integrate
    - toc.follow
    - search.suggest
    # - content.tabs.link
    # - content.code.annotation
    - content.code.copy
    - content.code.annotate
    - header.autohide

  palette:
    primary: white
    accent: orange

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/qim-center/

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
    - tags
    - search
    - privacy:
        links_attr_map:
          target: _blank
    - mkdocstrings:
        handlers:
          python:
            options:
              show_root_heading: false
              show_source: true
              show_root_full_path: true
              show_object_full_path: true
              show_symbol_type_heading: false
              show_symbol_type_toc: false
              separate_signature: true
              show_root_toc_entry: false
