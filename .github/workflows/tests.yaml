name: Tests

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each entry pins one Python version to one OS, so only these
        # 3 combinations run instead of the full outer product.
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.14"
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Just
        uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"

      - name: Setup uv and python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.12.5"  # uv version
          python-version: ${{ matrix.python-version }}
          enable-cache: "auto"

      - name: Run tests
        run: just test
