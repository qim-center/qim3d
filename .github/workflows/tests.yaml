name: Tests

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # We test on the minimum and maximum supported Python versions
        python-version: [3.12, 3.14]
    name: Ubuntu, Python ${{ matrix.python-version }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Just
        uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"

      - name: Setup uv and python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.12.5"  # uv version
          python-version: ${{ matrix.python-version }}
          enable-cache:

      - name: Run tests
        run: just test
