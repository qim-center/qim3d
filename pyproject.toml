
[project]
name = "qim3d"
version = "1.5.3"
license = "MIT"
description = "QIM tools and user interfaces for volumetric imaging"
urls = { Homepage = "https://platform.qim.dk/qim3d" }
authors = [
    { name = "Felipe Delestro", email = "fima@dtu.dk" },
    { name = "QIM Development Team", email = "info@qim.dk" },
]
maintainers = [
    { name = "Felipe Delestro", email = "fima@dtu.dk" },
    { name = "QIM Development Team", email = "info@qim.dk" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: User Interfaces",
]

requires-python = ">=3.11"
dependencies = [
    # Base
    "dask>=2023.6.0",
    "numpy>=1.26.0",
    "scipy>=1.11.2",

    # Mesh
    "trimesh>=4.4.9",
    "pytetwild",

    # Viz
    "imageio-ffmpeg>=0.6",
    "k3d>=2.17",
    "matplotlib>=3.8.0",
    "Pillow>=10.0.1",
    "plotly>=5.14.1",
    "PyGEL3D>=0.6.1",
    "pyvista[jupyter]>=0.45",
    "seaborn>=0.12.2",
    "tqdm>=4.65.0",

    # Jupyter
    "ipywidgets>=8.1.2",

    # Data
    "h5py>=3.9.0",
    "imagecodecs>=2024.12.30",
    "nibabel>=5.2.0",
    "olefile>=0.46",
    "ome_zarr>=0.12.0",
    "pydicom==2.4.4",
    "tifffile>=2025.1.10",
    "zarr>=3.0",

    # Processing
    "dask-image>=2024.5.3",
    "localthickness>=0.1.2",
    "pygorpho>=1.0.1",
    "scikit-image>=0.24.0",
    "slgbuilder>=0.2.1",
    "structure-tensor>=0.2.1",

    # Miscellaneous
    "outputformat>=0.1.3",
    "psutil>=5.9.0",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.scripts]
qim3d = "qim3d.cli:main"

[project.optional-dependencies]
deep-learning = [
    "torch>=2.0.1",
    "torchvision>=0.15.2",
    "torchinfo>=1.8.0",
    "monai>=1.2.0",
]

synthetic-data = ["noise>=1.2.2"]

gui = [
    "gradio>=5.1,<6",
    "gradio-improvedfileexplorer>=1.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
]

all = [
    "qim3d[deep-learning]",
    "qim3d[synthetic-data]",
    "qim3d[gui]",
]

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "jupyter" },
    { include-group = "lint" },
    { include-group = "test" },
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.7",
    "mkdocstrings[python]>=0.28.2",
    "mktestdocs>=0.2.4",
]

jupyter = [
    # See: https://github.com/microsoft/vscode-jupyter/issues/17228#issuecomment-4477302475 and a plethora of other issues on vscode-jupyter.
    "ipykernel<7",
]

lint = [
    "ruff>=0.15.20"  # Should match version in .pre-commit-config.yaml
]

test = ["pytest>=9.1.1"]

### Tools
[tool.setuptools]
include-package-data = true
license-files = []

[tool.setuptools.packages]
find = { namespaces = false }

# See list of rules here: https://docs.astral.sh/ruff/rules/
[tool.ruff]
line-length = 88
indent-width = 4
exclude = ["docs", "qim3d/tests"]

[tool.ruff.lint]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

select = [
    "F",
    "E",     # Errors
    "W",     # Warnings
    "I",     # Imports
    "N",     # Naming
    "D",     # Documentation
    "UP",    # Upgrades
    "YTT",
    "ANN",
    "ASYNC",
    "S",
    "BLE",
    "B",
    "A",
    "COM",
    "C4",
    "T10",
    "DJ",
    "EM",
    "EXE",
    "ISC",
    "LOG",
    "PIE",
    "PYI",
    "PT",
    "RSE",
    "SLF",
    "SLOT",
    "SIM",
    "TID",
    "TCH",
    "INT",
    "ERA",
    "PGH",
]

ignore = [
    "ANN002",
    "ANN003",
    "ANN101",
    "ANN201",
    "ANN204",
    "B008",
    "B026",
    "B028",
    "B905",
    "COM812",
    "D100",
    "D101",
    "D107",
    "D201",
    "D202",
    "D203",
    "D205",
    "D211",
    "D212",
    "D401",
    "D406",
    "D407",
    "E501",
    "E731",
    "F821",
    "F841",
    "ISC001",
    "S101",
    "S301",
    "S311",
    "S507",
    "S603",
    "S605",
    "S607",
    "SIM113",
    "W291",
    "W293",
]

[tool.ruff.format]
# Use single quotes for strings
quote-style = "single"

[tool.coverage.run]
omit = [
    "qim3d/tests/*",
    "qim3d/examples/*",
    "qim3d/css/*",
    "docs/*",
    "**/__init__.py",
    "config.py",
    "config-3.py",
]

[tool.pytest.ini_options]
addopts = "-p no:warnings" # "--ignore=qim3d/tests/notebooks -p no:warnings"

### Build System
[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"
